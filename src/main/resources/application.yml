spring:
  profiles:
    default: demo
  application:
    name: recrut-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recrut}
    # The application connects as app_rt, not as the table owner, so RLS remains active.
    username: ${DB_APP_USER:app_rt}
    password: ${DB_APP_PASSWORD:}
  flyway:
    # Migrations run with a separate schema-owner role.
    user: ${DB_OWNER_USER:recrut_owner}
    password: ${DB_OWNER_PASSWORD:}
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
